<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Teach Web — DRF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji"; background:#0f1115; color:#e6e6e6; }
    .wrap { max-width: 880px; margin: 56px auto; padding: 0 20px; }
    .card { background:#151922; border:1px solid #23283a; border-radius:16px; padding:24px; box-shadow: 0 8px 20px rgba(0,0,0,.25); }
    h1 { margin: 0 0 12px; font-size: 28px; letter-spacing:.2px; }
    p { margin: 0 0 16px; color:#aab3c0 }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap:12px; margin-top: 16px; }
    a.tile { display:block; padding:14px 16px; border-radius:12px; text-decoration:none; color:#e6e6e6; border:1px solid #2a3045; background:linear-gradient(180deg,#182033,#13192b); transition:.15s; }
    a.tile:hover { transform: translateY(-1px); border-color:#3a4160; }
    .muted { color:#8c96a6; font-size: 13px; }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; background:#24304a; border:1px solid #2d3a58; color:#b7c3d9; font-size:12px; margin-left:8px; }
    .footer { margin-top:18px; color:#7e8797; font-size:13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>API is running <span class="badge">DRF</span></h1>
      <p>Добро пожаловать! Это стартовая страница проекта. Ниже — быстрые ссылки.</p>

      <div class="grid">
        <a class="tile" href="/admin/">Админка →</a>
        <a class="tile" href="/api/courses/">Курсы (ViewSet) →</a>
        <a class="tile" href="/api/lessons/">Уроки (Generic) →</a>
        <a class="tile" href="/api-auth/login/">Вход в Browsable API →</a>
      </div>

      <div class="footer">
        Под капотом: Django + Django REST framework.
        Для тестов с PowerShell используй <code>Invoke-RestMethod</code> (мы уже проверили).
      </div>
    </div>
  </div>
</body>
</html>
